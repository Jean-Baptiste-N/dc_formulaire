{% comment %}Partial: une section avec ses postes{% endcomment %}
<div id="section-{{ section.id }}" class="card shadow-sm mb-3 section-card">
  <div class="card-header d-flex align-items-center gap-2 bg-light">
    <i class="bi bi-folder2"></i>
    <form hx-post="{% url 'formulaire:section_save' candidat.pk section.id %}"
          hx-target="#section-{{ section.id }}"
          hx-swap="outerHTML"
          class="d-flex align-items-center gap-2 flex-grow-1">
      {% csrf_token %}
      <input type="text"
             name="titre"
             value="{{ section.titre }}"
             placeholder="Titre de la section (ex: Expérience, Formation…)"
             class="form-control form-control-sm flex-grow-1"
             required>
      <button type="submit" class="btn btn-sm btn-outline-primary btn-icon" title="Sauvegarder">
        <i class="bi bi-save"></i>
      </button>
    </form>
    <button class="btn btn-sm btn-outline-danger btn-icon"
            hx-post="{% url 'formulaire:section_delete' candidat.pk section.id %}"
            hx-target="#section-{{ section.id }}"
            hx-swap="outerHTML"
            hx-confirm="Supprimer cette section et tous ses éléments ?"
            title="Supprimer la section">
      <i class="bi bi-trash"></i>
    </button>
  </div>

  <div class="card-body p-2">
    <!-- Postes list -->
    <div id="postes-{{ section.id }}">
      {% for poste in section.postes %}
        {% include "formulaire/partials/poste_row.html" with poste=poste section_id=section.id candidat=candidat %}
      {% endfor %}
    </div>

    <!-- Add poste button -->
    <div class="mt-2 ms-3">
      <button class="btn btn-sm btn-outline-secondary"
              hx-post="{% url 'formulaire:poste_add' candidat.pk section.id %}"
              hx-target="#postes-{{ section.id }}"
              hx-swap="beforeend">
        <i class="bi bi-plus"></i> Ajouter un élément
      </button>
    </div>
  </div>
</div>
