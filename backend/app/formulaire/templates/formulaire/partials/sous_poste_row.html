{% comment %}Partial: un sous-poste (niveau 2 de la hiérarchie){% endcomment %}
<div id="sous-poste-{{ sous_poste.id }}" class="sous-item-row rounded p-1 mb-1 bg-white">
  <div class="d-flex align-items-center gap-2">
    <i class="bi bi-dash text-secondary" style="font-size: 0.75rem;"></i>
    <form hx-post="{% url 'formulaire:sous_poste_save' candidat.pk section_id poste_id sous_poste.id %}"
          hx-target="#sous-poste-{{ sous_poste.id }}"
          hx-swap="outerHTML"
          class="d-flex align-items-center gap-2 flex-grow-1">
      {% csrf_token %}
      <input type="text"
             name="texte"
             value="{{ sous_poste.texte }}"
             placeholder="Détail (ex: Gestion d'une équipe de 5 personnes…)"
             class="form-control form-control-sm flex-grow-1"
             style="font-size: 0.85rem;">
      <button type="submit" class="btn btn-sm btn-outline-primary btn-icon" title="Sauvegarder">
        <i class="bi bi-save"></i>
      </button>
    </form>
    <button class="btn btn-sm btn-outline-danger btn-icon"
            hx-post="{% url 'formulaire:sous_poste_delete' candidat.pk section_id poste_id sous_poste.id %}"
            hx-target="#sous-poste-{{ sous_poste.id }}"
            hx-swap="outerHTML"
            hx-confirm="Supprimer ce sous-élément ?"
            title="Supprimer">
      <i class="bi bi-trash"></i>
    </button>
  </div>
</div>
