{% comment %}Partial: un poste (point de liste) avec ses sous-postes{% endcomment %}
<div id="poste-{{ poste.id }}" class="item-row rounded p-2 mb-2 bg-white">
  <div class="d-flex align-items-center gap-2">
    <i class="bi bi-dot text-secondary"></i>
    <form hx-post="{% url 'formulaire:poste_save' candidat.pk section_id poste.id %}"
          hx-target="#poste-{{ poste.id }}"
          hx-swap="outerHTML"
          class="d-flex align-items-center gap-2 flex-grow-1">
      {% csrf_token %}
      <input type="text"
             name="texte"
             value="{{ poste.texte }}"
             placeholder="Description (ex: Chef de projet, 2020-2022…)"
             class="form-control form-control-sm flex-grow-1">
      <button type="submit" class="btn btn-sm btn-outline-primary btn-icon" title="Sauvegarder">
        <i class="bi bi-save"></i>
      </button>
    </form>
    <button class="btn btn-sm btn-outline-danger btn-icon"
            hx-post="{% url 'formulaire:poste_delete' candidat.pk section_id poste.id %}"
            hx-target="#poste-{{ poste.id }}"
            hx-swap="outerHTML"
            hx-confirm="Supprimer cet élément ?"
            title="Supprimer">
      <i class="bi bi-trash"></i>
    </button>
  </div>

  <!-- Sous-postes -->
  <div id="sous-postes-{{ poste.id }}" class="ms-3 mt-1">
    {% for sous_poste in poste.sous_postes %}
      {% include "formulaire/partials/sous_poste_row.html" with sous_poste=sous_poste poste_id=poste.id section_id=section_id candidat=candidat %}
    {% endfor %}
  </div>

  <div class="ms-3 mt-1">
    <button class="btn btn-sm btn-outline-light text-secondary border-0 py-0"
            hx-post="{% url 'formulaire:sous_poste_add' candidat.pk section_id poste.id %}"
            hx-target="#sous-postes-{{ poste.id }}"
            hx-swap="beforeend">
      <i class="bi bi-plus"></i> Ajouter un sous-élément
    </button>
  </div>
</div>
